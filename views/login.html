<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Omnifood</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/ionicons@2.0.1/css/ionicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>

    <div class="login-container">
        <div class="header-box">
            <div class="logo-text">Omnifood</div>
            <div class="subtitle">Log in to your account to get healthy meals</div>
        </div>

        <div id="alertBox" class="alert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <i class="ion-ios-email-outline"></i>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="ion-ios-locked-outline"></i>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">Log In</button>
        </form>

        <div class="switch-link">
            Don't have an account? <a href="/signup-page">Sign up here</a>
            <div style="margin-top: 15px; border-top: 1px dashed rgba(255,255,255,0.15); padding-top: 15px;">
                <a href="/" style="font-size: 0.85rem; color: #eee; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: none;">
                    <i class="ion-ios-home-outline" style="margin-right: 6px; font-size: 1.1rem; vertical-align: middle;"></i>Return to Home Page
                </a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const alertBox = document.getElementById("alertBox");
            alertBox.style.display = "none";

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            try {
                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (data.success) {
                    alertBox.className = "alert alert-success";
                    alertBox.textContent = data.message + " Redirecting...";
                    alertBox.style.display = "block";
                    
                    // Save user payload in client storage
                    localStorage.setItem("user", JSON.stringify(data.user));

                    setTimeout(() => {
                        // Redirect to the appropriate dashboard
                        if (data.user.role === "admin") {
                            window.location.href = "/admin";
                        } else if (data.user.role === "delivery") {
                            window.location.href = "/delivery";
                        } else {
                            window.location.href = "/menu";
                        }
                    }, 2000);
                } else {
                    alertBox.className = "alert alert-error";
                    alertBox.textContent = data.message || "Invalid credentials.";
                    alertBox.style.display = "block";
                }
            } catch (err) {
                alertBox.className = "alert alert-error";
                alertBox.textContent = "Network error. Please try again.";
                alertBox.style.display = "block";
            }
        });
    </script>
</body>
</html>
